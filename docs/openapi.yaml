openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    A RESTful API for managing personal and business contacts.

    It supports user authentication, CRUD operations for contacts,
    contact categorization (e.g., work, personal, home),
    and file uploads for avatars.

    Designed for integration with web and mobile apps.
tags:
  - name: Contacts
    description: Operations with contacts
  # теги, що ви будете використовувати
servers:
  - url: http://localhost:3000
  - url: '' #посилання на задеплоєний сайт
paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{contactId}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{contactId}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{contactId}/delete.yaml'
  # тут будуть посилання на ендпоінти
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
